services:
  db:
    image: compassaq-postgis:15-3
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: aq_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compassaq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compassaq_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-compassaq}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql --host=db --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\" --no-password --tuples-only --command='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4
    container_name: aq_adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aq_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-compassaq}:${POSTGRES_PASSWORD:-compassaq_local_only}@db:5432/${POSTGRES_DB:-compassaq}
      COMPASSAQ_DATA_DIR: /var/lib/compassaq
      COMPASSAQ_ENV: ${COMPASSAQ_ENV:-development}
      COMPASSAQ_ENCRYPTION_KEY: ${COMPASSAQ_ENCRYPTION_KEY:-}
      SYSTEM_TIMEZONE: ${SYSTEM_TIMEZONE:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      COMPASSAQ_APPLICATION_URL: ${COMPASSAQ_APPLICATION_URL:-}
      DISABLE_PAID_API_REQUESTS: ${DISABLE_PAID_API_REQUESTS:-false}
      PYTHONPATH: /app
    volumes:
      - compassaq_runtime:/var/lib/compassaq
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/readiness', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aq_scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-compassaq}:${POSTGRES_PASSWORD:-compassaq_local_only}@db:5432/${POSTGRES_DB:-compassaq}
      COMPASSAQ_DATA_DIR: /var/lib/compassaq
      COMPASSAQ_ENV: ${COMPASSAQ_ENV:-development}
      COMPASSAQ_ENCRYPTION_KEY: ${COMPASSAQ_ENCRYPTION_KEY:-}
      SYSTEM_TIMEZONE: ${SYSTEM_TIMEZONE:-}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-15}
      SCHEDULER_IMPORT_MAX_RUNTIME_SECONDS: ${SCHEDULER_IMPORT_MAX_RUNTIME_SECONDS:-21600}
      DISABLE_PAID_API_REQUESTS: ${DISABLE_PAID_API_REQUESTS:-false}
      PYTHONPATH: /app
    volumes:
      - compassaq_runtime:/var/lib/compassaq
    command: ["python", "-m", "jobs.scheduler"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aq_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api

volumes:
  pg_data:
  compassaq_runtime:
