# Nginx config for serving a Vite-built React SPA and proxying API requests.
# Keep this minimal and explicit for production use.

server {
  listen 80;
  server_name _;

  # The Vite build output is copied to this directory.
  root /usr/share/nginx/html;
  index index.html;

  # Serve static files when they exist; otherwise fall back to index.html
  # so client-side routing works on refresh or deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the FastAPI service.
  # The trailing slash strips the /api/ prefix when forwarding.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Basic security headers for static content.
  # These are safe defaults and can be extended later if needed.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
