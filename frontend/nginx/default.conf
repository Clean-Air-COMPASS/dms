# Nginx config for serving a Vite-built React SPA and proxying API requests.
# Keep this minimal and explicit for production use.

# Docker can give the API a different address after a restart or recreation.
# Re-resolve its service name while Nginx runs, including after a DNS outage.
upstream compassaq_api {
  zone compassaq_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  server api:8000 resolve;
}

server {
  listen 80;
  server_name _;

  # The application accepts CSV files up to 5,000,000 bytes. This 5 MiB
  # request-body ceiling leaves room for multipart headers without allowing an
  # unbounded upload; the application remains the authoritative file-size check.
  client_max_body_size 5m;

  # The Vite build output is copied to this directory.
  root /usr/share/nginx/html;
  index index.html;

  location = /version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Serve static files when they exist; otherwise fall back to index.html
  # so client-side routing works on refresh or deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the FastAPI service.
  # The trailing slash strips the /api/ prefix when forwarding.
  location /api/ {
    proxy_pass http://compassaq_api/;
    proxy_http_version 1.1;
    # Preserve the browser's authority, including a non-default Compose port,
    # for exact same-origin checks. The API validates Origin against this value.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # CSV imports are synchronous row imports. Keep this finite and long enough
    # for the supported 5 MB file size without using Nginx's default timeout.
    proxy_read_timeout 600s;
  }

  # Basic security headers for static content.
  # These are safe defaults and can be extended later if needed.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
